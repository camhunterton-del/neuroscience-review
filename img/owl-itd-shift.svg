<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-label="Barn owl sound-map neuron tuning-curve shift after prism adaptation" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect x="1" y="1" width="718" height="468" rx="10" fill="#f7f6f3" stroke="#e6e4df" stroke-width="1.5"/>

  <!-- Title -->
  <text x="415" y="42" text-anchor="middle" font-size="21" font-weight="600" fill="#1f2937">Sound-map neurons re-tune to follow the shifted eyes</text>

  <!-- Legend (upper-left, compact swatch) -->
  <line x1="150" y1="74" x2="176" y2="74" stroke="#8a877f" stroke-width="3"/>
  <text x="183" y="78" font-size="13" fill="#4b4b47">Normal owl</text>
  <line x1="150" y1="93" x2="176" y2="93" stroke="#2d5d7b" stroke-width="3.4"/>
  <text x="183" y="97" font-size="13" fill="#2d5d7b">Prism-reared owl</text>

  <!-- Faint drop-lines linking each peak to its axis tick -->
  <line x1="310" y1="135" x2="310" y2="400" stroke="#cfcdc7" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="460" y1="135" x2="460" y2="400" stroke="#9fb6c4" stroke-width="1" stroke-dasharray="3 4"/>
  <!-- Ghost tick: full 23-degree correction (kept clear of the blue curve) -->
  <line x1="513" y1="336" x2="513" y2="400" stroke="#d5d3cd" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="582" y="300" font-size="11" fill="#a5a29b">+57 would be the</text>
  <text x="582" y="316" font-size="11" fill="#a5a29b">full 23° correction.</text>
  <text x="582" y="332" font-size="11" fill="#a5a29b">Owls fall short.</text>

  <!-- Axes -->
  <line x1="140" y1="90" x2="140" y2="400" stroke="#c9c7c1" stroke-width="1.2"/>
  <line x1="140" y1="400" x2="690" y2="400" stroke="#c9c7c1" stroke-width="1.2"/>
  <!-- x-axis ticks -->
  <line x1="160" y1="397" x2="160" y2="403" stroke="#c9c7c1" stroke-width="1.2"/>
  <line x1="310" y1="396" x2="310" y2="404" stroke="#8f8d87" stroke-width="1.4"/>
  <line x1="460" y1="396" x2="460" y2="404" stroke="#2d5d7b" stroke-width="1.4"/>

  <!-- Curve fills -->
  <path d="M 200 380 C 265 380 265 135 310 135 C 355 135 355 380 420 380 Z" fill="#8a877f" fill-opacity="0.08"/>
  <path d="M 350 380 C 415 380 415 135 460 135 C 505 135 505 380 570 380 Z" fill="#2d5d7b" fill-opacity="0.10"/>
  <!-- Curve strokes (raised, nonzero baseline at y=380) -->
  <path d="M 200 380 C 265 380 265 135 310 135 C 355 135 355 380 420 380" fill="none" stroke="#8a877f" stroke-width="3"/>
  <path d="M 350 380 C 415 380 415 135 460 135 C 505 135 505 380 570 380" fill="none" stroke="#2d5d7b" stroke-width="3.4"/>

  <!-- Shift annotation arrow between the two peaks -->
  <line x1="320" y1="118" x2="450" y2="118" stroke="#2d5d7b" stroke-width="1.4"/>
  <polygon points="318,118 327,114 327,122" fill="#2d5d7b"/>
  <polygon points="452,118 443,114 443,122" fill="#2d5d7b"/>
  <text x="385" y="108" text-anchor="middle" font-size="13" font-weight="500" fill="#2d5d7b">preference slides ~+42 µs</text>

  <!-- x-axis tick labels (above axis, at foot of each drop-line) -->
  <text x="160" y="393" text-anchor="middle" font-size="12" fill="#9a978f">−42</text>
  <text x="310" y="393" text-anchor="middle" font-size="13" fill="#6b6862">0</text>
  <text x="460" y="393" text-anchor="middle" font-size="13" font-weight="500" fill="#2d5d7b">+42</text>
  <text x="513" y="393" text-anchor="middle" font-size="11" fill="#a5a29b">+57</text>

  <!-- 0 anchor note -->
  <text x="310" y="415" text-anchor="middle" font-size="11" fill="#9a978f">straight ahead</text>

  <!-- Directional labels (below axis, off the curves) -->
  <text x="142" y="432" font-size="12" fill="#8f8d87">sound reaches left ear first</text>
  <text x="688" y="432" text-anchor="end" font-size="12" fill="#8f8d87">sound reaches right ear first</text>

  <!-- Axis titles -->
  <text x="415" y="454" text-anchor="middle" font-size="14" fill="#4b4b47">Timing gap between the two ears (microseconds)</text>
  <text x="46" y="245" text-anchor="middle" font-size="14" fill="#4b4b47" transform="rotate(-90 46 245)">Neuron firing rate</text>
</svg>