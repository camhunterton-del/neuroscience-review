name: Site watchdog

on:
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: site-watchdog

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for GitHub Pages to deploy (push only)
        if: github.event_name == 'push'
        run: sleep 120

      - name: Every page returns HTTP 200
        run: |
          BASE="https://theneuroreview.com"
          fail=0
          for p in $(git ls-files '*.html' | grep -vE '(^404\.html$)|((^|/)_[^/]*\.html$)'); do
            ok=0; code=000
            for attempt in 1 2 3; do
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 25 "$BASE/$p")
              if [ "$code" = "200" ]; then ok=1; break; fi
              sleep 10
            done
            if [ "$ok" = "1" ]; then echo "ok   /$p"; else echo "FAIL /$p -> HTTP $code"; fail=1; fi
          done
          exit $fail

      - name: Homepage content sanity
        run: |
          home=$(curl -s --max-time 25 "https://theneuroreview.com/")
          fail=0
          echo "$home" | grep -q "The Neuroscience Review" || { echo "MISSING site title"; fail=1; }
          echo "$home" | grep -q 'news.html">News' || { echo "MISSING News nav link"; fail=1; }
          echo "$home" | grep -q 'commons.html">The Commons' || { echo "MISSING The Commons nav link"; fail=1; }
          [ "$fail" = "0" ] && echo "homepage sanity ok"
          exit $fail

      - name: HTTPS is enforced
        run: |
          redir=$(curl -s -o /dev/null -w "%{redirect_url}" -I --max-time 25 "http://theneuroreview.com/")
          case "$redir" in
            https://*) echo "http redirects to $redir (ok)" ;;
            *) echo "http is NOT redirecting to https (got '$redir')"; exit 1 ;;
          esac

      - name: Internal links and assets resolve
        run: python3 .github/scripts/check_internal_links.py

      - name: News feed reads newest-first
        run: python3 .github/scripts/check_news_order.py

      - name: Discovery surfaces and key assets are live and valid
        run: |
          BASE="https://theneuroreview.com"
          fail=0
          code() { curl -s -o /dev/null -w "%{http_code}" --max-time 25 "$1"; }
          body() { curl -s --max-time 25 "$1"; }

          # Atom feed: 200 and actually an Atom document with entries.
          c=$(code "$BASE/feed.xml")
          if [ "$c" = "200" ] && body "$BASE/feed.xml" | grep -q "<feed" && body "$BASE/feed.xml" | grep -q "<entry"; then
            echo "ok   feed.xml"; else echo "FAIL feed.xml (HTTP $c, or not a non-empty Atom feed)"; fail=1; fi

          # Sitemap: 200 and a real urlset listing the homepage.
          c=$(code "$BASE/sitemap.xml")
          if [ "$c" = "200" ] && body "$BASE/sitemap.xml" | grep -q "<urlset" && body "$BASE/sitemap.xml" | grep -q "theneuroreview.com/</loc>"; then
            echo "ok   sitemap.xml"; else echo "FAIL sitemap.xml (HTTP $c, or not a valid sitemap)"; fail=1; fi

          # Search index: 200 and parses as a non-empty JSON array of objects with url+title.
          if body "$BASE/search-index.json" | python3 -c "import sys,json; d=json.load(sys.stdin); assert isinstance(d,list) and d and all('url' in e and 'title' in e for e in d)" 2>/dev/null; then
            echo "ok   search-index.json"; else echo "FAIL search-index.json (missing, invalid JSON, or wrong shape)"; fail=1; fi

          # Stylesheet must serve (a broken CSS deploy makes every page look broken).
          c=$(code "$BASE/css/styles.css")
          if [ "$c" = "200" ]; then echo "ok   css/styles.css"; else echo "FAIL css/styles.css -> HTTP $c"; fail=1; fi

          # Every committed 3D model must serve 200 (the Lab explorers rely on them).
          for g in $(git ls-files '*.glb'); do
            c=$(code "$BASE/$g")
            if [ "$c" = "200" ]; then echo "ok   $g"; else echo "FAIL $g -> HTTP $c"; fail=1; fi
          done

          # The subscribe form endpoint should exist in the served homepage markup
          # (assert the markup, do not submit an address).
          if body "$BASE/" | grep -q "buttondown.com/api/emails/embed-subscribe"; then
            echo "ok   subscribe form present"; else echo "FAIL subscribe form markup missing on homepage"; fail=1; fi

          exit $fail

      - name: Open or update alert issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🔴 Site watchdog alert';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'The site watchdog just failed a check.',
              '',
              `- Trigger: **${context.eventName}**`,
              `- Run log: ${runUrl}`,
              '',
              'Open the run log and look for the step marked with a red X (a page down, missing homepage content, HTTPS not enforced, a broken internal link, the News feed out of date order, or a discovery surface / asset down: feed, sitemap, search index, CSS, a 3D model, or the subscribe form).'
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100
            });
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title, body
              });
            }

      - name: Close alert issue when checks pass
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🔴 Site watchdog alert';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100
            });
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number,
                body: 'Resolved — all watchdog checks passing again.'
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, state: 'closed'
              });
            }
