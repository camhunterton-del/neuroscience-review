name: Daily digest

# The single morning email for The Neuroscience Review. Folds the contributor
# outreach engine, an inbox reply-concierge (draft only), the Wednesday-post
# guardian, and the subscriber / Bluesky numbers into ONE weekday email, so the
# inbox is not flooded with several separate automated reports. Outreach now runs
# LIVE here on the cron (its own scheduled workflow has been retired).

on:
  schedule:
    - cron: '30 14 * * 1-5'   # weekdays ~10:30am ET (14:30 UTC)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "dry_run: 'true' drafts + reports but sends no outreach; 'false' sends live outreach"
        required: false
        default: 'true'

permissions:
  contents: read

concurrency:
  group: daily-digest

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip if secrets not configured yet
        id: guard
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ] || [ -z "$GMAIL_APP_PASSWORD" ]; then
            echo "ANTHROPIC_API_KEY and/or GMAIL_APP_PASSWORD secret is not set — skipping. Add them in repo Settings to enable."
            echo "ready=false" >> $GITHUB_OUTPUT
          else
            echo "ready=true" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.ready == 'true'
        with:
          node-version: '20'

      - name: Install deps
        if: steps.guard.outputs.ready == 'true'
        run: npm install @anthropic-ai/sdk nodemailer imapflow --no-save --silent

      - name: Run daily digest
        if: steps.guard.outputs.ready == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_USER: theneuroreview@gmail.com
          DIGEST_TO: theneuroreview@gmail.com
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          BLUESKY_HANDLE: theneuroreview.bsky.social
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          # Emails / name fragments already contacted from other accounts (e.g. the
          # Columbia address). Keeps that contact list out of the public repo.
          OUTREACH_EXCLUDE: ${{ secrets.OUTREACH_EXCLUDE }}
          # LIVE on the scheduled cron (outreach is now folded in here). A manual
          # workflow_dispatch still defaults to dry-run unless you pass 'false'.
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          MAX_SENDS: '3'
        run: node .github/scripts/daily_digest.mjs
